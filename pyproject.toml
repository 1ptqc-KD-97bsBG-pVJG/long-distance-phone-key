[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-key-lab"
version = "0.1.0"
description = "Experimental owner-authorized Bluetooth relay for remote phone-key setup"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["bleak==3.0.2"]

[project.optional-dependencies]
web = ["aiohttp==3.14.3"]
lab = ["bumble==0.0.235", "grpcio>=1.70", "protobuf>=5", "pytest==9.1.1", "pytest-asyncio==1.4.0", "aiohttp==3.14.3"]

[project.scripts]
phone-key-lab = "phone_key_lab.cli:main"
phone-key-web = "phone_key_lab.web_server:main"

[tool.setuptools.package-data]
phone_key_lab = ["web/*.html", "web/*.js", "web/*.css"]

[tool.setuptools.packages.find]
include = ["phone_key_lab*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
